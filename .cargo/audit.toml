[advisories]
ignore = [
    "RUSTSEC-2026-0235" # rkyv 0.7.x via workflow-core/rusty-kaspa; fixed line requires an upstream-compatible breaking update. See SECURITY_ADVISORIES.md.
]

# Keep informational maintenance and soundness findings visible in audit
# output without representing them as ordinary vulnerability failures.
informational_warnings = ["unmaintained", "unsound"]
