[workspace]
resolver = "3"
members = [
    "crates/kaspa-gateway-core",
    "crates/kaspa-gateway-config",
    "crates/kaspa-gateway-security",
    "crates/kaspa-gateway-rk-node",
    "crates/kaspa-gateway-rk-bridge",
    "crates/kaspa-gateway-api",
    "crates/kaspa-gateway-db",
    "crates/kaspa-gateway-node",
    "crates/kaspa-gateway-observability",
    "crates/kaspa-gateway-runtime",
    "apps/kaspa-gateway-cli",
    "apps/kaspa-gateway-desktop/src-tauri"
]

# Reduce native desktop debug-link memory without rebuilding dependency profiles.
[profile.dev.package.kaspa-gateway-desktop]
debug = 0
incremental = false

# Native IBD proof conversion is CPU-bound (BUG-0029). Keep its official
# libraries optimized in tauri dev; retain debug assertions and stop deadlines.
[profile.dev.package.kaspa-consensus-core]
opt-level = 2

[profile.dev.package.kaspa-hashes]
opt-level = 2

[profile.dev.package.kaspa-p2p-lib]
opt-level = 2

# BlockHash uses this non-generic compression backend.
[profile.dev.package.blake2b_simd]
opt-level = 2

# Post-chain pruning-proof application computes PoW matrix ranks (BUG-0032).
# Optimize this measured dev hot path without changing official code or stop budgets.
[profile.dev.package.kaspa-pow]
opt-level = 2

# The remaining measured proof-application and hash-vector serialization hot path
# is emitted by kaspa-consensus while shutdown waits for the Tokio blocking task.
[profile.dev.package.kaspa-consensus]
opt-level = 2

# Header-store writes serialize every applied header through kaspa-database.
[profile.dev.package.kaspa-database]
opt-level = 2

# The failing stack remains inside bincode serialization and byte-copy helpers.
[profile.dev.package.bincode]
opt-level = 2

# Serde's core Serialize implementations are directly present in the stopping stack.
[profile.dev.package.serde_core]
opt-level = 2

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KaspaPulse/kaspa-gateway-rust"
homepage = "https://github.com/KaspaPulse/kaspa-gateway-rust"
documentation = "https://github.com/KaspaPulse/kaspa-gateway-rust"
authors = ["KaspaPulse"]
description = "Kaspa Gateway rewritten in Rust with secure modular architecture."

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
keyring = "3"
directories = "6.0.0"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting"] }
duckdb = { version = "1", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
