name: Desktop Artifacts

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to package
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: desktop-artifacts-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  trusted-builder:
    name: Trusted reusable desktop artifact builder
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/desktop-artifacts-builder.yml
    with:
      commit_sha: ${{ inputs.commit_sha }}
