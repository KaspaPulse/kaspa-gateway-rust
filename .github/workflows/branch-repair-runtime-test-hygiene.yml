name: Branch-only runtime test hygiene repair

on:
  push:
    branches:
      - chore/rebootstrap-2026-08-10

concurrency:
  group: branch-repair-runtime-test-hygiene-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'KaspaPulse'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/rebootstrap-2026-08-10
          persist-credentials: true
          fetch-depth: 1

      - name: Install Rust 1.97.1 formatter
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply exact cross-platform and cleanup repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/kaspa-gateway-desktop/src-tauri/tests/integrated_runtime_ipc_smoke_tests.rs")
          text = path.read_text(encoding="utf-8")

          functions = [
              "mainnet_and_testnet10_test_workers_stay_alive_through_startup_verification",
              "duplicate_owner_for_one_network_is_rejected",
              "node_start_trace_uses_same_exe_mode_not_external",
              "success_response_contains_process_start_evidence_and_stream_logs",
              "early_self_worker_exit_preserves_complete_safe_stderr_and_returns_error",
              "spawn_failure_remains_an_error",
          ]

          guard_line = "    let _runtime_guard = RuntimeWorkerTestGuard::new();\n"
          for function in functions:
              marker = f"fn {function}() {{"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing test function: {function}")
              next_test = text.find("\n#[test]", start + len(marker))
              end = len(text) if next_test < 0 else next_test
              block = text[start:end]
              if guard_line.strip() in block:
                  continue
              lock_start = text.find("    let _guard = runtime_test_lock()", start, end)
              if lock_start < 0:
                  raise SystemExit(f"missing serialized lock in: {function}")
              lock_end = text.find(";\n", lock_start, end)
              if lock_end < 0:
                  raise SystemExit(f"unterminated serialized lock in: {function}")
              insert_at = lock_end + 2
              text = text[:insert_at] + guard_line + text[insert_at:]

          old_status = '''    assert_contains_all(
              &error,
              &[
                  "self-worker exited during startup",
                  "role=node",
                  "network=mainnet",
                  "status=exit code: 1",
                  complete_tail,
              ],
          );'''
          new_status = '''    assert_contains_all(
              &error,
              &[
                  "self-worker exited during startup",
                  "role=node",
                  "network=mainnet",
                  "status=exit ",
                  complete_tail,
              ],
          );
          assert!(
              error.contains("status=exit code: 1")
                  || error.contains("status=exit status: 1"),
              "startup error must preserve the platform exit status: {error}"
          );'''

          count = text.count(old_status)
          if count != 1:
              raise SystemExit(f"expected one platform-specific status assertion, found {count}")
          text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding="utf-8")
          print(f"added panic-safe cleanup guards to {len(functions)} tests and made exit-status assertion portable")
          PY

          cargo fmt --all
          git diff --check

      - name: Remove branch-only repair workflow
        shell: bash
        run: rm -- .github/workflows/branch-repair-runtime-test-hygiene.yml

      - name: Commit repaired test hygiene
        shell: bash
        run: |
          git config user.name "KaspaPulse Automation"
          git config user.email "211207200+KaspaPulse@users.noreply.github.com"
          git add -- \
            apps/kaspa-gateway-desktop/src-tauri/tests/integrated_runtime_ipc_smoke_tests.rs \
            .github/workflows/branch-repair-runtime-test-hygiene.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "repair produced no changes" >&2; exit 1; }
          git commit -m "test: make runtime harness cleanup panic-safe and portable"
          git push origin HEAD:chore/rebootstrap-2026-08-10
