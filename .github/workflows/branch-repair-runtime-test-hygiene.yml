name: Branch-only runtime test hygiene repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - chore/rebootstrap-2026-08-10

concurrency:
  group: branch-repair-runtime-test-hygiene-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'chore/rebootstrap-2026-08-10'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/rebootstrap-2026-08-10
          persist-credentials: true
          fetch-depth: 0

      - name: Install Rust 1.97.1 formatter
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply stable exit contract and panic-safe cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path(
              "apps/kaspa-gateway-desktop/src-tauri/tests/"
              "integrated_runtime_ipc_smoke_tests.rs"
          )
          tests = tests_path.read_text(encoding="utf-8")

          functions = [
              "production_self_worker_arguments_match_child_parser",
              "mainnet_and_testnet10_test_workers_stay_alive_through_startup_verification",
              "duplicate_owner_for_one_network_is_rejected",
              "node_start_trace_uses_same_exe_mode_not_external",
              "success_response_contains_process_start_evidence_and_stream_logs",
              "early_self_worker_exit_preserves_complete_safe_stderr_and_returns_error",
              "spawn_failure_remains_an_error",
          ]
          guard_line = "    let _runtime_guard = RuntimeWorkerTestGuard::new();\n"

          for function in functions:
              marker = f"fn {function}() {{"
              start = tests.find(marker)
              if start < 0:
                  raise SystemExit(f"missing test function: {function}")

              next_test = tests.find("\n#[test]", start + len(marker))
              end = len(tests) if next_test < 0 else next_test
              block = tests[start:end]
              if guard_line.strip() in block:
                  continue

              lock_start = tests.find(
                  "    let _guard = runtime_test_lock()", start, end
              )
              if lock_start < 0:
                  raise SystemExit(f"missing serialized lock in: {function}")

              lock_end = tests.find(";\n", lock_start, end)
              if lock_end < 0:
                  raise SystemExit(f"unterminated serialized lock in: {function}")

              insert_at = lock_end + 2
              tests = tests[:insert_at] + guard_line + tests[insert_at:]

          platform_specific = '            "status=exit code: 1",'
          stable_assertion = '            "exit_code=1",'
          platform_count = tests.count(platform_specific)
          stable_count = tests.count(stable_assertion)

          if platform_count == 1 and stable_count == 0:
              tests = tests.replace(platform_specific, stable_assertion, 1)
          elif platform_count == 0 and stable_count == 1:
              pass
          else:
              raise SystemExit(
                  "unexpected test exit assertion state: "
                  f"platform={platform_count}, stable={stable_count}"
              )

          source_path = Path(
              "apps/kaspa-gateway-desktop/src-tauri/src/"
              "integrated_runtime_commands.rs"
          )
          source = source_path.read_text(encoding="utf-8")

          old_error = '''        return Err(format!(
              "self-worker exited during startup;role={};network={};pid={};status={};logs={}",
              role, network, pid, exit_status, captured
          ));'''
          new_error = '''        // `ExitStatus` display text differs by platform. Keep it for diagnostics,
          // but expose a stable numeric field for callers and cross-platform tests.
          let exit_code = exit_status
              .code()
              .map_or_else(|| "unknown".to_string(), |code| code.to_string());

          return Err(format!(
              "self-worker exited during startup;role={};network={};pid={};status={};exit_code={};logs={}",
              role, network, pid, exit_status, exit_code, captured
          ));'''

          old_count = source.count(old_error)
          new_count = source.count(";exit_code={};logs={}")
          if old_count == 1 and new_count == 0:
              source = source.replace(old_error, new_error, 1)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  "unexpected runtime error contract state: "
                  f"old={old_count}, new={new_count}"
              )

          tests_path.write_text(tests, encoding="utf-8")
          source_path.write_text(source, encoding="utf-8")
          print(
              "updated stable exit_code contract and installed panic-safe cleanup "
              f"for {len(functions)} serialized tests"
          )
          PY

          cargo fmt --all
          git diff --check

      - name: Remove branch-only repair workflows
        shell: bash
        run: |
          rm -f -- \
            .github/workflows/branch-repair-runtime-test-hygiene.yml \
            .github/workflows/branch-repair-runtime-test-hygiene-v2.yml

      - name: Commit repaired runtime test contract
        shell: bash
        run: |
          git config user.name "KaspaPulse Automation"
          git config user.email "211207200+KaspaPulse@users.noreply.github.com"
          git add -A -- \
            apps/kaspa-gateway-desktop/src-tauri/src/integrated_runtime_commands.rs \
            apps/kaspa-gateway-desktop/src-tauri/tests/integrated_runtime_ipc_smoke_tests.rs \
            .github/workflows/branch-repair-runtime-test-hygiene.yml \
            .github/workflows/branch-repair-runtime-test-hygiene-v2.yml
          git diff --cached --check
          git diff --cached --quiet && {
            echo "repair produced no changes" >&2
            exit 1
          }
          git commit -m "test: stabilize runtime exit contract and cleanup"
          git push origin HEAD:chore/rebootstrap-2026-08-10
