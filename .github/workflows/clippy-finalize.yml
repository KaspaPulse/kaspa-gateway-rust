name: "Finalize Rust Clippy fixes"

on:
  push:
    branches: ["chore/security-baseline-2026-08-08"]

permissions:
  contents: write

jobs:
  finalize:
    name: "Validate Clippy fixes and refresh Graphify"
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "Checkout repair branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/security-baseline-2026-08-08
          fetch-depth: 0
          persist-credentials: true

      - name: "Install Linux prerequisites"
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: "Install Rust 1.97.1"
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: "Apply exact and machine-applicable Clippy repairs"
        shell: bash
        run: |
          python3 .github/scripts/finalize_clippy.py
          cargo clippy --fix --locked --workspace --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all

      - name: "Validate strict Clippy across workspace"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: "Refresh Graphify code snapshot"
        run: python3 -m pip install --user --disable-pip-version-check graphify-cli==1.2.1 && export PATH="$HOME/.local/bin:$PATH" && graphify . --update --code-only --no-viz && python3 -c "import json,pathlib; p=pathlib.Path('graphify-out/graph.json'); d=json.loads(p.read_text()); assert p.stat().st_size > 0 and d.get('nodes') is not None and d.get('edges') is not None"

      - name: "Commit validated repair"
        shell: bash
        run: |
          rm .github/workflows/clippy-finalize.yml .github/scripts/finalize_clippy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add graphify-out
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'fix: satisfy Rust 1.97 strict clippy'
          git push origin HEAD:chore/security-baseline-2026-08-08
