name: "Finalize Rust Clippy fixes"

on:
  push:
    branches: ["chore/security-baseline-2026-08-08"]

permissions:
  contents: write

jobs:
  finalize:
    name: "Validate Clippy fixes and refresh Graphify"
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "Checkout repair branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/security-baseline-2026-08-08
          fetch-depth: 0
          persist-credentials: true

      - name: "Install Linux prerequisites"
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: "Install Rust 1.97.1"
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: "Apply exact and convergent Clippy repairs"
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import re; p=Path("apps/kaspa-gateway-desktop/src-tauri/src/integrated_runtime_commands.rs"); t=p.read_text(encoding="utf-8"); pattern=r"\n#\[cfg\(test\)\]\npub\(crate\) fn kgw_worker_node_command_args_for_test_v1\(.*?\n\}\n\nfn kgw_worker_role_from_request"; t2,n=re.subn(pattern,"\nfn kgw_worker_role_from_request",t,count=1,flags=re.S); assert n == 1, n; p.write_text(t2,encoding="utf-8")'
          python3 -c 'from pathlib import Path; p=Path("apps/kaspa-gateway-desktop/src-tauri/src/lib.rs"); t=p.read_text(encoding="utf-8"); old="            let Some(dir) = kgw_ui_trace_log_dir_v37() else {\n                return None;\n            };"; new="            let dir = kgw_ui_trace_log_dir_v37()?;"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old,new,1),encoding="utf-8")'
          python3 -c 'from pathlib import Path; p=Path(".github/scripts/finalize_clippy.py"); t=p.read_text(encoding="utf-8"); old="    1,\n    \"question_mark ui trace directory\",\n)\n"; new="    1,\n    \"question_mark ui trace directory\",\n    optional=True,\n)\n"; assert t.count(old) == 1, t.count(old); p.write_text(t.replace(old, new, 1), encoding="utf-8")'
          python3 .github/scripts/finalize_clippy.py

          for pass in 1 2 3 4; do
            echo "Clippy auto-fix pass ${pass}"
            before="$(git diff --no-ext-diff | sha256sum | cut -d' ' -f1)"

            set +e
            cargo clippy --fix --locked --workspace --all-targets --allow-dirty --allow-staged -- -D warnings
            fix_status=$?
            set -e

            cargo fmt --all
            after="$(git diff --no-ext-diff | sha256sum | cut -d' ' -f1)"

            if [[ "${before}" == "${after}" ]]; then
              echo "No further source changes after pass ${pass}; strict validation will decide the result (auto-fix exit=${fix_status})."
              break
            fi
          done

      - name: "Validate strict Clippy across workspace"
        id: strict-clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee clippy-final.log
          status=${PIPESTATUS[0]}
          exit "${status}"

      - name: "Upload finalizer Clippy diagnostics"
        if: failure() && steps.strict-clippy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: finalizer-clippy-diagnostics
          path: clippy-final.log
          retention-days: 3

      - name: "Refresh Graphify code snapshot"
        run: python3 -m pip install --user --disable-pip-version-check graphify-cli==1.2.1 && export PATH="$HOME/.local/bin:$PATH" && graphify . --update --code-only --no-viz && python3 -c "import json,pathlib; p=pathlib.Path('graphify-out/graph.json'); d=json.loads(p.read_text()); assert p.stat().st_size > 0 and d.get('nodes') is not None and d.get('edges') is not None"

      - name: "Commit validated repair"
        shell: bash
        run: |
          rm .github/workflows/clippy-finalize.yml .github/scripts/finalize_clippy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add graphify-out
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'fix: satisfy Rust 1.97 strict clippy'
          git push origin HEAD:chore/security-baseline-2026-08-08
