name: Finalize Rust 1.97 Clippy fixes

on:
  push:
    branches:
      - chore/security-baseline-2026-08-08

permissions:
  contents: write

jobs:
  finalize:
    name: Apply Clippy fixes, validate, and refresh Graphify
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/security-baseline-2026-08-08
          fetch-depth: 0
          persist-credentials: true

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Apply exact Clippy recommendations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          db = Path('crates/kaspa-gateway-db/src/lib.rs')
          text = db.read_text(encoding='utf-8')

          old_repeat = '''            let placeholders = std::iter::repeat("?")
              .take(chunk.len())
              .collect::<Vec<_>>()
              .join(",");'''
          new_repeat = '''            let placeholders = std::iter::repeat_n("?", chunk.len())
              .collect::<Vec<_>>()
              .join(",");'''
          assert text.count(old_repeat) == 1, text.count(old_repeat)
          text = text.replace(old_repeat, new_repeat)

          old_type = '''        if let Some(tx_type) = filter.tx_type {
            if !tx_type.eq_ignore_ascii_case("ALL") {
                query.push_str(" AND tx_type = ?");
                params.push(Box::new(tx_type.to_string()));
            }
        }'''
          new_type = '''        if let Some(tx_type) = filter.tx_type
            && !tx_type.eq_ignore_ascii_case("ALL")
        {
            query.push_str(" AND tx_type = ?");
            params.push(Box::new(tx_type.to_string()));
        }'''
          assert text.count(old_type) == 3, text.count(old_type)
          text = text.replace(old_type, new_type)

          old_direction = '''        if let Some(direction) = filter.direction {
            if !direction.eq_ignore_ascii_case("ALL") {
                query.push_str(" AND direction = ?");
                params.push(Box::new(direction.to_string()));
            }
        }'''
          new_direction = '''        if let Some(direction) = filter.direction
            && !direction.eq_ignore_ascii_case("ALL")
        {
            query.push_str(" AND direction = ?");
            params.push(Box::new(direction.to_string()));
        }'''
          assert text.count(old_direction) == 3, text.count(old_direction)
          text = text.replace(old_direction, new_direction)
          db.write_text(text, encoding='utf-8')

          cfg = Path('crates/kaspa-gateway-config/src/lib.rs')
          text = cfg.read_text(encoding='utf-8')

          old_root = '''    if let Ok(exe) = env::current_exe() {
        if let Some(parent) = exe.parent() {
            return Ok(parent.to_path_buf());
        }
    }'''
          new_root = '''    if let Ok(exe) = env::current_exe()
        && let Some(parent) = exe.parent()
    {
        return Ok(parent.to_path_buf());
    }'''
          assert text.count(old_root) == 1, text.count(old_root)
          text = text.replace(old_root, new_root)

          old_keyring = '''                    if let Value::String(text) = child {
                        if text.starts_with("keyring_managed:") {
                            *text = String::new();
                        }
                    }'''
          new_keyring = '''                    if let Value::String(text) = child
                        && text.starts_with("keyring_managed:")
                    {
                        *text = String::new();
                    }'''
          assert text.count(old_keyring) == 1, text.count(old_keyring)
          text = text.replace(old_keyring, new_keyring)
          cfg.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all

      - name: Validate strict Clippy across workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Refresh Graphify code snapshot
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check 'graphify-cli==1.2.1'
          export PATH="$HOME/.local/bin:$PATH"
          graphify . --update --code-only --no-viz
          python3 - <<'PY'
          import json
          from pathlib import Path
          graph = Path('graphify-out/graph.json')
          assert graph.is_file() and graph.stat().st_size > 0
          payload = json.loads(graph.read_text(encoding='utf-8'))
          assert isinstance(payload, dict)
          assert payload.get('nodes') is not None
          assert payload.get('edges') is not None
          print(f"Graphify validated: {len(payload.get('nodes', []))} nodes / {len(payload.get('edges', []))} edges")
          PY

      - name: Commit validated source and Graphify refresh
        shell: bash
        run: |
          rm .github/workflows/clippy-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/kaspa-gateway-db/src/lib.rs \
                  crates/kaspa-gateway-config/src/lib.rs \
                  graphify-out \
                  .github/workflows/clippy-finalize.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix: satisfy Rust 1.97 strict clippy'
          git push origin HEAD:chore/security-baseline-2026-08-08
