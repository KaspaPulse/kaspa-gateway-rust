name: Desktop 0.1.1 Admin Credential Probe

on:
  push:
    branches:
      - ops/release-011-recovery-gate-20260817

permissions:
  contents: read

jobs:
  probe:
    name: Probe release administration credential presence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      PAT: ${{ secrets.PAT }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    steps:
      - name: Report credential kinds only
        shell: bash
        run: |
          set -euo pipefail

          found=0
          for name in RELEASE_ADMIN_TOKEN GH_ADMIN_TOKEN RELEASE_TOKEN GH_PAT GITHUB_PAT ADMIN_TOKEN PAT; do
            if [[ -n "${!name:-}" ]]; then
              echo "FOUND_TOKEN_CREDENTIAL=$name"
              found=1
            fi
          done

          if [[ -n "${RELEASE_APP_ID:-}" && -n "${RELEASE_APP_PRIVATE_KEY:-}" ]]; then
            echo "FOUND_APP_CREDENTIAL=RELEASE_APP"
            found=1
          fi
          if [[ -n "${GH_APP_ID:-}" && -n "${GH_APP_PRIVATE_KEY:-}" ]]; then
            echo "FOUND_APP_CREDENTIAL=GH_APP"
            found=1
          fi
          if [[ -n "${APP_ID:-}" && -n "${APP_PRIVATE_KEY:-}" ]]; then
            echo "FOUND_APP_CREDENTIAL=APP"
            found=1
          fi

          if [[ "$found" -eq 0 ]]; then
            echo "ADMIN_CREDENTIAL_PRESENT=NO"
          else
            echo "ADMIN_CREDENTIAL_PRESENT=YES"
          fi
