name: Temporary Clippy Fix

on:
  push:
    branches:
      - chore/security-baseline-2026-08-08
    paths:
      - .github/workflows/_temporary-clippy-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply idiomatic Rust 1.97 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              file.write_text(text.replace(old, new))

          db = "crates/kaspa-gateway-db/src/lib.rs"
          replace_exact(
              db,
              '''            let placeholders = std::iter::repeat("?")
                .take(chunk.len())
                .collect::<Vec<_>>()''',
              '''            let placeholders = std::iter::repeat_n("?", chunk.len())
                .collect::<Vec<_>>()''',
              1,
          )
          replace_exact(
              db,
              '''        if let Some(tx_type) = filter.tx_type {
            if !tx_type.eq_ignore_ascii_case("ALL") {
                query.push_str(" AND tx_type = ?");
                params.push(Box::new(tx_type.to_string()));
            }
        }''',
              '''        if let Some(tx_type) = filter.tx_type
            && !tx_type.eq_ignore_ascii_case("ALL")
        {
            query.push_str(" AND tx_type = ?");
            params.push(Box::new(tx_type.to_string()));
        }''',
              3,
          )
          replace_exact(
              db,
              '''        if let Some(direction) = filter.direction {
            if !direction.eq_ignore_ascii_case("ALL") {
                query.push_str(" AND direction = ?");
                params.push(Box::new(direction.to_string()));
            }
        }''',
              '''        if let Some(direction) = filter.direction
            && !direction.eq_ignore_ascii_case("ALL")
        {
            query.push_str(" AND direction = ?");
            params.push(Box::new(direction.to_string()));
        }''',
              3,
          )

          config = "crates/kaspa-gateway-config/src/lib.rs"
          replace_exact(
              config,
              '''    if let Ok(exe) = env::current_exe() {
        if let Some(parent) = exe.parent() {
            return Ok(parent.to_path_buf());
        }
    }''',
              '''    if let Ok(exe) = env::current_exe()
        && let Some(parent) = exe.parent()
    {
        return Ok(parent.to_path_buf());
    }''',
              1,
          )
          replace_exact(
              config,
              '''                    if let Value::String(text) = child {
                        if text.starts_with("keyring_managed:") {
                            *text = String::new();
                        }
                    }''',
              '''                    if let Value::String(text) = child
                        && text.starts_with("keyring_managed:")
                    {
                        *text = String::new();
                    }''',
              1,
          )
          PY
          cargo fmt --all

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kaspa-gateway-db/src/lib.rs crates/kaspa-gateway-config/src/lib.rs
          git commit -m "fix: satisfy Rust 1.97 strict clippy"
          git push origin HEAD:chore/security-baseline-2026-08-08
