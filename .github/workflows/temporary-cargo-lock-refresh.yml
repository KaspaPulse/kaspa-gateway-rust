name: Temporary Cargo Lock Refresh

on:
  push:
    branches: [chore/security-baseline-2026-08-08]
    paths:
      - "**/Cargo.toml"
      - ".github/workflows/temporary-cargo-lock-refresh.yml"

permissions:
  contents: write

concurrency:
  group: temporary-cargo-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: refresh Cargo.lock only
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Refresh lockfile resolution
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock after dependency cleanup"
          git push origin "HEAD:${GITHUB_REF_NAME}"
