name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog verified and unknown secrets
    runs-on: ubuntu-24.04
    # Cold-cache native dependencies can take >10 minutes; keep the scan bounded without canceling before policy/runtime work starts.
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Validate native secret-scan contracts
        run: cargo test --locked -p xtask --features secret-scan --bin kgw-secret-scan

      - name: Scan repository history for high-confidence secrets
        run: cargo run --locked -p xtask --features secret-scan --bin kgw-secret-scan -- --root .
