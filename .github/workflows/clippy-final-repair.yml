name: Final bounded Clippy repair

on:
  push:
    branches: [chore/modernization-final-2026-08-09]
    paths:
      - '.github/workflows/clippy-final-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/modernization-final-2026-08-09
          fetch-depth: 0

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Apply machine-applicable Clippy fixes to affected packages
        shell: bash
        run: |
          set +e
          cargo clippy --fix \
            -p kaspa-gateway-runtime \
            -p kaspa-gateway-rk-node \
            --all-targets --all-features \
            --allow-dirty --allow-staged -- -D warnings
          set -e

      - name: Move rk-node test module after production items
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/kaspa-gateway-rk-node/src/official_kaspa_runtime.rs')
          text = path.read_text()
          start_marker = '#[cfg(test)]\nmod runtime_binding_tests {'
          next_marker = '#[cfg(feature = "official-kaspa-runtime-mainline")]'
          start = text.find(start_marker)
          next_pos = text.find(next_marker, start)
          if start < 0 or next_pos < 0:
              raise SystemExit('expected runtime_binding_tests markers not found')
          block = text[start:next_pos].rstrip()
          text = (text[:start] + text[next_pos:]).rstrip() + '\n\n' + block + '\n'
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Enforce bounded source change set
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(crates/kaspa-gateway-runtime/src/transaction_sync\.rs|crates/kaspa-gateway-rk-node/src/kgw_real_owner_runtime\.rs|crates/kaspa-gateway-rk-node/src/kgw_service_controller\.rs|crates/kaspa-gateway-rk-node/src/official_kaspa_runtime\.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files modified by bounded repair:'
            echo "$unexpected"
            exit 1
          fi
          echo 'Bounded changed files:'
          git diff --name-only

      - name: Validate strict Clippy after repair
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Remove one-shot workflow and push repaired sources
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/clippy-final-repair.yml
          git config user.name 'KaspaPulse'
          git config user.email 'KaspaPulse@gmail.com'
          git add -u
          git status --short
          git commit -m 'fix: satisfy strict Clippy across runtime and rk-node'
          git push origin HEAD:chore/modernization-final-2026-08-09
