name: security-rust-parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  security-rust-parity:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/kaspa-gateway-desktop
        run: npm install

      - name: Install optional Rust security tools
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run Rust security parity
        shell: pwsh
        run: .\tools\security-rust-parity.ps1

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-rust-parity-reports
          path: |
            dist/security/*
            dist/recovery/*

