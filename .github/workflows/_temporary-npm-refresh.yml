name: Temporary npm dependency refresh

on:
  push:
    branches:
      - chore/modernization-final-2026-08-09
    paths:
      - '.github/workflows/_temporary-npm-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/modernization-final-2026-08-09
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/kaspa-gateway-desktop/package-lock.json
            e2e/package-lock.json
          package-manager-cache: true

      - name: Refresh desktop dependencies to current registry latest
        working-directory: apps/kaspa-gateway-desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts \
            @eslint/js@latest \
            @tauri-apps/cli@latest \
            eslint@latest \
            globals@latest
          npm install --save --save-exact --package-lock-only --ignore-scripts \
            @tauri-apps/plugin-dialog@latest
          npm ci --ignore-scripts
          npm run lint
          npm audit --audit-level=high

      - name: Refresh E2E dependencies to current registry latest
        working-directory: e2e
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact --package-lock-only --ignore-scripts \
            @eslint/js@latest \
            eslint@latest \
            globals@latest \
            @wdio/cli@latest \
            @wdio/json-reporter@latest \
            @wdio/junit-reporter@latest \
            @wdio/local-runner@latest \
            @wdio/mocha-framework@latest \
            @wdio/spec-reporter@latest \
            @wdio/tauri-plugin@latest \
            @wdio/tauri-service@latest \
            webdriverio@latest
          npm ci --ignore-scripts
          npm run lint
          npm run check
          npm audit --audit-level=high

      - name: Commit and push refreshed npm manifests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/kaspa-gateway-desktop/package.json apps/kaspa-gateway-desktop/package-lock.json e2e/package.json e2e/package-lock.json; then
            echo 'npm manifests already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/kaspa-gateway-desktop/package.json \
                  apps/kaspa-gateway-desktop/package-lock.json \
                  e2e/package.json \
                  e2e/package-lock.json
          git diff --cached --check
          git commit -m 'build: refresh npm dependencies to current stable releases'
          git push origin HEAD:chore/modernization-final-2026-08-09
