name: KGW E2E Lock Refresh Probe

on:
  push:
    branches:
      - fix/e2e-deepmerge-ghsa-ggr8

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Verify bundled npm
        run: |
          npm --version
          test "$(npm --version)" = "11.17.0"

      - name: Refresh E2E lockfile only
        working-directory: e2e
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean-install E2E dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Verify deepmerge resolution
        working-directory: e2e
        run: npm ls deepmerge-ts --all

      - name: Audit E2E npm tree
        working-directory: e2e
        run: npm audit --audit-level=moderate

      - name: Run E2E syntax and security compatibility checks
        working-directory: e2e
        run: npm run check

      - name: Guard generated diff
        shell: bash
        run: |
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test "$status" = " M e2e/package-lock.json"
          git diff --check -- e2e/package-lock.json

      - name: Commit generated lockfile only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- e2e/package-lock.json
          git commit -m "fix(e2e): refresh lock for deepmerge security override"
          git push origin "HEAD:${GITHUB_REF_NAME}"
