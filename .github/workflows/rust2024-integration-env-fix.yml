name: Rust 2024 Integration Env Fix

on:
  push:
    branches:
      - chore/security-baseline-2026-08-08
    paths:
      - .github/workflows/rust2024-integration-env-fix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Centralize Rust 2024 test environment mutation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/kaspa-gateway-desktop/src-tauri/tests/integrated_runtime_ipc_smoke_tests.rs")
          text = path.read_text(encoding="utf-8")
          set_count = text.count("std::env::set_var(")
          remove_count = text.count("std::env::remove_var(")
          if set_count != 21 or remove_count != 13:
              raise SystemExit(f"unexpected env mutation count: set={set_count} remove={remove_count}")

          text = text.replace("std::env::set_var(", "set_runtime_worker_test_env(")
          text = text.replace("std::env::remove_var(", "remove_runtime_worker_test_env(")

          anchor = '''fn runtime_test_lock() -> &'static Mutex<()> {
              static LOCK: OnceLock<Mutex<()>> = OnceLock::new();
              LOCK.get_or_init(|| Mutex::new(()))
          }
          '''
          helper = '''fn runtime_test_lock() -> &'static Mutex<()> {
              static LOCK: OnceLock<Mutex<()>> = OnceLock::new();
              LOCK.get_or_init(|| Mutex::new(()))
          }

          fn set_runtime_worker_test_env<K, V>(key: K, value: V)
          where
              K: AsRef<std::ffi::OsStr>,
              V: AsRef<std::ffi::OsStr>,
          {
              // SAFETY: Every environment-mutating test in this integration-test binary holds
              // runtime_test_lock() for the full mutation/use/cleanup sequence. The KGW_* values
              // are read synchronously while planning/spawning child self-workers; parent log-reader
              // threads do not read process environment variables, and cleanup stops workers before
              // removing their test configuration. This preserves the Rust 2024 environment contract.
              unsafe { std::env::set_var(key, value) };
          }

          fn remove_runtime_worker_test_env<K>(key: K)
          where
              K: AsRef<std::ffi::OsStr>,
          {
              // SAFETY: Same serialized integration-test invariant as set_runtime_worker_test_env.
              unsafe { std::env::remove_var(key) };
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit("runtime_test_lock anchor drifted")
          text = text.replace(anchor, helper, 1)

          old_new = '''    fn new() -> Self {
                  clear_runtime_worker_test_env();
                  let _ = integrated_runtime_commands::kgw_shutdown_all_runtime_workers_v1();
                  Self
              }
          '''
          new_new = '''    fn new() -> Self {
                  let _ = integrated_runtime_commands::kgw_shutdown_all_runtime_workers_v1();
                  clear_runtime_worker_test_env();
                  Self
              }
          '''
          if text.count(old_new) != 1:
              raise SystemExit("RuntimeWorkerTestGuard::new anchor drifted")
          text = text.replace(old_new, new_new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format Rust source
        run: cargo fmt --all

      - name: Install Graphify
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "graphifyy==0.9.36"
          graphify --version

      - name: Refresh and validate Graphify snapshot
        run: |
          graphify . --update --code-only --no-viz
          graphify query "How are Rust 2024 integration-test environment mutations serialized and cleaned up for self-worker tests?"
          git diff --check
          test -s graphify-out/graph.json
          test -s graphify-out/manifest.json
          test -s graphify-out/GRAPH_REPORT.md

      - name: Commit migration and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/kaspa-gateway-desktop/src-tauri/tests/integrated_runtime_ipc_smoke_tests.rs \
            graphify-out/graph.json \
            graphify-out/manifest.json \
            graphify-out/GRAPH_REPORT.md
          git rm .github/workflows/rust2024-integration-env-fix.yml
          git diff --cached --check
          git commit -m "fix: serialize Rust 2024 integration test environment"
          git push origin HEAD:chore/security-baseline-2026-08-08
