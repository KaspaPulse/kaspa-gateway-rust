name: Cleanup Rust repair workflow

on:
  push:
    branches:
      - agent/modernize-ci-toolchain

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/modernize-ci-toolchain

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-rust-clippy.yml
          git commit -m "ci: remove temporary Rust repair workflow"
          git push origin HEAD:agent/modernize-ci-toolchain
