name: Desktop Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable desktop version in X.Y.Z form
        required: true
        type: string
      commit_sha:
        description: Exact current main commit qualified by Desktop Artifacts
        required: true
        type: string
      artifact_run_id:
        description: Successful Desktop Artifacts workflow run for commit_sha
        required: true
        type: string
      confirmation:
        description: Type STAGE_DESKTOP_RELEASE_DRAFT
        required: true
        type: string

permissions: read-all

concurrency:
  group: desktop-release-draft-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  stage-release-draft:
    name: Validate and stage immutable-ready draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/desktop-artifacts-builder.yml

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Stage and verify draft through Rust owner
        run: cargo run --locked -p xtask -- desktop-release-draft-stage
