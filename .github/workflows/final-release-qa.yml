name: final-release-qa

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  final-qa-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop dependencies
        working-directory: apps/kaspa-gateway-desktop
        run: npm install

      - name: Final QA
        shell: pwsh
        run: .\tools\final-qa.ps1

      - name: Final Installer
        shell: pwsh
        run: .\tools\final-installer.ps1

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaspa-gateway-final-windows
          path: dist/release/*









