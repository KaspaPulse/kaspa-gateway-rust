name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust check
        run: cargo check --workspace

      - name: Rust tests
        run: cargo test --workspace

      - name: Install desktop dependencies
        working-directory: apps/kaspa-gateway-desktop
        run: npm install

      - name: Build Tauri installer
        working-directory: apps/kaspa-gateway-desktop
        run: npm run tauri:build

      - name: Build CLI release
        run: cargo build -p kaspa-gateway-cli --release

      - name: Collect artifacts and hashes
        shell: pwsh
        run: .\tools\build-release.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaspa-gateway-windows-release
          path: dist/release/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*















