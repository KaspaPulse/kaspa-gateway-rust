name: One-shot verified Rust Clippy cleanup

on:
  push:
    branches: ["chore/security-baseline-2026-08-09-clean"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout clean modernization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/security-baseline-2026-08-09-clean
          fetch-depth: 0
          persist-credentials: true

      - name: Apply only verified Clippy repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected, label, optional=False):
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == expected and new_count == 0:
                  print(f"{label}: applying {old_count}")
                  return text.replace(old, new)
              if old_count == 0 and new_count == expected:
                  print(f"{label}: already repaired")
                  return text
              if optional and old_count == 0:
                  print(f"{label}: not present; skipped")
                  return text
              raise RuntimeError(f"{label}: old={old_count} new={new_count} expected={expected}")

          db = Path("crates/kaspa-gateway-db/src/lib.rs")
          text = db.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              '''            let placeholders = std::iter::repeat("?")\n                .take(chunk.len())\n                .collect::<Vec<_>>()\n                .join(",");''',
              '''            let placeholders = std::iter::repeat_n("?", chunk.len())\n                .collect::<Vec<_>>()\n                .join(",");''',
              1,
              "manual_repeat_n",
          )
          text = replace_exact(
              text,
              '''        if let Some(tx_type) = filter.tx_type {\n            if !tx_type.eq_ignore_ascii_case("ALL") {\n                query.push_str(" AND tx_type = ?");\n                params.push(Box::new(tx_type.to_string()));\n            }\n        }''',
              '''        if let Some(tx_type) = filter.tx_type\n            && !tx_type.eq_ignore_ascii_case("ALL")\n        {\n            query.push_str(" AND tx_type = ?");\n            params.push(Box::new(tx_type.to_string()));\n        }''',
              3,
              "tx_type collapsible_if",
          )
          text = replace_exact(
              text,
              '''        if let Some(direction) = filter.direction {\n            if !direction.eq_ignore_ascii_case("ALL") {\n                query.push_str(" AND direction = ?");\n                params.push(Box::new(direction.to_string()));\n            }\n        }''',
              '''        if let Some(direction) = filter.direction\n            && !direction.eq_ignore_ascii_case("ALL")\n        {\n            query.push_str(" AND direction = ?");\n            params.push(Box::new(direction.to_string()));\n        }''',
              3,
              "direction collapsible_if",
          )
          text = replace_exact(
              text,
              '''        if row_matches {\n            if !seen.insert(tx.id.clone()) {\n                continue;\n            }\n        }''',
              '''        if row_matches && !seen.insert(tx.id.clone()) {\n            continue;\n        }''',
              1,
              "row_matches collapsible_if",
              optional=True,
          )
          db.write_text(text, encoding="utf-8")

          cfg = Path("crates/kaspa-gateway-config/src/lib.rs")
          text = cfg.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              '''    if let Ok(exe) = env::current_exe() {\n        if let Some(parent) = exe.parent() {\n            return Ok(parent.to_path_buf());\n        }\n    }''',
              '''    if let Ok(exe) = env::current_exe()\n        && let Some(parent) = exe.parent()\n    {\n        return Ok(parent.to_path_buf());\n    }''',
              1,
              "current_exe collapsible_if",
          )
          text = replace_exact(
              text,
              '''                    if let Value::String(text) = child {\n                        if text.starts_with("keyring_managed:") {\n                            *text = String::new();\n                        }\n                    }''',
              '''                    if let Value::String(text) = child\n                        && text.starts_with("keyring_managed:")\n                    {\n                        *text = String::new();\n                    }''',
              1,
              "keyring collapsible_if",
          )
          cfg.write_text(text, encoding="utf-8")

          lib = Path("apps/kaspa-gateway-desktop/src-tauri/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              '''        let Some(dir) = kgw_ui_trace_log_dir_v37() else {\n            return None;\n        };''',
              '''        let dir = kgw_ui_trace_log_dir_v37()?;''',
              1,
              "question_mark ui trace directory",
              optional=True,
          )
          lib.write_text(text, encoding="utf-8")

          node_old = '''        if !accumulated.contains_key(&key) {\n            if let Some(tx) = transactions.remove(&tx_id) {\n                accumulated.insert(key, tx);\n            }\n        }'''
          node_new = '''        if !accumulated.contains_key(&key)\n            && let Some(tx) = transactions.remove(&tx_id)\n        {\n            accumulated.insert(key, tx);\n        }'''
          matches = []
          for root in (Path("crates"), Path("apps")):
              for path in root.rglob("*.rs"):
                  source = path.read_text(encoding="utf-8")
                  if node_old in source:
                      matches.append(path)
          if len(matches) == 1:
              p = matches[0]
              source = p.read_text(encoding="utf-8")
              p.write_text(source.replace(node_old, node_new, 1), encoding="utf-8")
              print(f"node_rpc collapsible_if: repaired {p}")
          elif len(matches) == 0:
              print("node_rpc collapsible_if: not present; skipped")
          else:
              raise RuntimeError(f"node_rpc collapsible_if: ambiguous matches={matches}")
          PY

      - name: Commit verified repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-rust-clippy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates apps .github/workflows/one-shot-rust-clippy-cleanup.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected verified repairs were not produced'; exit 1; }
          git commit -m 'fix: satisfy verified Rust 1.97 clippy diagnostics'
          git push origin HEAD:chore/security-baseline-2026-08-09-clean
