name: Temporary Clippy Repair Push

on:
  push:
    branches:
      - chore/modernization-final-2026-08-09

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply strict Clippy repair patch
        shell: bash
        env:
          CLIPPY_PATCH_GZ_B64: 
        run: |
          printf '%s' "$CLIPPY_PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/clippy-fix.patch
          git apply --check /tmp/clippy-fix.patch
          git apply /tmp/clippy-fix.patch
          cargo fmt --all

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/source-snapshot-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve strict Clippy modernization blockers'
          git push origin HEAD:chore/modernization-final-2026-08-09
