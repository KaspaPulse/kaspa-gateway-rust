name: Temporary Clippy Autofix Snapshot

on:
  push:
    branches:
      - chore/modernization-final-2026-08-09

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Apply machine-applicable Clippy fixes
        shell: bash
        run: |
          set +e
          cargo clippy --fix --locked --workspace --all-targets --allow-dirty --allow-staged -- -D warnings 2>&1 | tee /tmp/clippy-fix.log
          echo "clippy_exit=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e
          cargo fmt --all
          git diff -- . ':!.github/workflows/source-snapshot-temp.yml' > /tmp/clippy-fix.patch

      - name: Create fixed source archive
        run: tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf /tmp/clippy-fixed-source.tar.gz .

      - name: Upload autofix diagnostics and source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-autofix-source
          path: |
            /tmp/clippy-fix.log
            /tmp/clippy-fix.patch
            /tmp/clippy-fixed-source.tar.gz
          retention-days: 1
