name: Desktop Artifacts Trusted Builder

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to package
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows-x64-nsis:
    name: Windows x64 NSIS package and smoke
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-windows-x64

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/kaspa-gateway-desktop/package-lock.json
          package-manager-cache: true
      - name: Install pinned Syft 1.52.0
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: syft@1.52.0,wasm-pack@0.15.0
          fallback: none

      - name: Build and qualify Windows artifacts with Rust owner
        run: cargo run --locked -p xtask -- desktop-artifacts-stage windows

      - name: Attest Windows SPDX SBOM
        id: attest-windows-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/kaspa-gateway-windows-artifact/KaspaGateway-windows-x64-nsis.exe
            ${{ runner.temp }}/kaspa-gateway-windows-artifact/kaspa-gateway-desktop-windows-x64.exe
          sbom-path: ${{ runner.temp }}/kaspa-gateway-windows-artifact/WINDOWS_SBOM.spdx.json
      - name: Preserve Windows SBOM attestation with Rust owner
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-windows-sbom.outputs.bundle-path }}
        run: cargo run --locked -p xtask -- desktop-artifacts-stage preserve-windows-sbom

      - name: Attest qualified Windows executable artifacts
        id: attest-qualified-windows
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/kaspa-gateway-windows-artifact/KaspaGateway-windows-x64-nsis.exe
            ${{ runner.temp }}/kaspa-gateway-windows-artifact/kaspa-gateway-desktop-windows-x64.exe

      - name: Preserve Windows build provenance with Rust owner
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-qualified-windows.outputs.bundle-path }}
        run: cargo run --locked -p xtask -- desktop-artifacts-stage preserve-windows-provenance
      - name: Upload qualified Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaspa-gateway-windows-x64-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/kaspa-gateway-windows-artifact
          if-no-files-found: error
          retention-days: 14

  macos-universal-dmg:
    name: macOS Universal DMG package and smoke
    runs-on: macos-15-intel
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Install Rust 1.98.1 and Apple targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: desktop-macos-universal
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/kaspa-gateway-desktop/package-lock.json
          package-manager-cache: true

      - name: Install pinned Syft 1.52.0
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: syft@1.52.0,wasm-pack@0.15.0
          fallback: none

      - name: Build and qualify macOS artifacts with Rust owner
        run: cargo run --locked -p xtask -- desktop-artifacts-stage macos
      - name: Attest macOS SPDX SBOM
        id: attest-macos-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/kaspa-gateway-macos-artifact/KaspaGateway-macos-universal.dmg
            ${{ runner.temp }}/kaspa-gateway-macos-artifact/KaspaGateway-macos-universal-app.zip
          sbom-path: ${{ runner.temp }}/kaspa-gateway-macos-artifact/MACOS_SBOM.spdx.json

      - name: Preserve macOS SBOM attestation with Rust owner
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-macos-sbom.outputs.bundle-path }}
        run: cargo run --locked -p xtask -- desktop-artifacts-stage preserve-macos-sbom

      - name: Attest qualified macOS release artifacts
        id: attest-qualified-macos
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/kaspa-gateway-macos-artifact/KaspaGateway-macos-universal.dmg
            ${{ runner.temp }}/kaspa-gateway-macos-artifact/KaspaGateway-macos-universal-app.zip

      - name: Preserve macOS build provenance with Rust owner
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-qualified-macos.outputs.bundle-path }}
        run: cargo run --locked -p xtask -- desktop-artifacts-stage preserve-macos-provenance

      - name: Upload qualified macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaspa-gateway-macos-universal-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/kaspa-gateway-macos-artifact
          if-no-files-found: error
          retention-days: 14
