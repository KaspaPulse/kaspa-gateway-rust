name: Safe targeted Clippy repair

on:
  push:
    branches: ["chore/modernization-clean-2026-08-09"]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout clean modernization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/modernization-clean-2026-08-09
          fetch-depth: 0
          persist-credentials: true

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Apply machine-applicable fixes only to failing crates
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo clippy --fix --locked \
            -p kaspa-gateway-db \
            -p kaspa-gateway-config \
            --all-targets --allow-dirty --allow-staged -- -D warnings
          fix_status=$?
          set -e
          echo "clippy --fix exit=${fix_status}; source diff is authoritative and will be validated by normal CI"
          cargo fmt --all

          allowed='^(crates/kaspa-gateway-db/src/lib.rs|crates/kaspa-gateway-config/src/lib.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed by targeted repair:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git diff --check

      - name: Commit source repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/clippy-safe-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/kaspa-gateway-db/src/lib.rs crates/kaspa-gateway-config/src/lib.rs .github/workflows/clippy-safe-fix.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'fix: satisfy strict Clippy in database and config crates'
          git push origin HEAD:chore/modernization-clean-2026-08-09
