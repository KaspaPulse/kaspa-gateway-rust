name: Temporary Clippy repair

on:
  push:
    branches:
      - chore/modernization-final-2026-08-09

permissions:
  contents: write

concurrency:
  group: temporary-clippy-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/modernization-final-2026-08-09
          fetch-depth: 0

      - name: Apply source-level Clippy repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str, expected: int = 1) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} match(es), found {count}")
              return text.replace(old, new)

          owner_path = Path('crates/kaspa-gateway-rk-node/src/kgw_real_owner_runtime.rs')
          owner = owner_path.read_text()
          owner = replace_exact(
              owner,
              '#[allow(dead_code)]\n\nfn',
              '#[allow(dead_code)]\nfn',
              'outer-attribute blank lines',
              expected=5,
          )
          owner = replace_exact(
              owner,
              '''    let mut args = kaspad_lib_mainline::args::Args::default();\n\n    args.appdir = Some(kgw_owner_safe_runtime_appdir(settings.network));\n    args.utxoindex = settings.enable_utxo_index;\n    args.archival = settings.archival;\n    args.yes = true;\n    args.disable_upnp = true;\n    args.log_level = "INFO".to_string();\n''',
              '''    let mut args = kaspad_lib_mainline::args::Args {\n        appdir: Some(kgw_owner_safe_runtime_appdir(settings.network)),\n        utxoindex: settings.enable_utxo_index,\n        archival: settings.archival,\n        yes: true,\n        disable_upnp: true,\n        log_level: "INFO".to_string(),\n        ..Default::default()\n    };\n''',
              'mainline Args initializer',
          )
          owner = replace_exact(
              owner,
              '''    let mut args = kaspad_lib_tn12::args::Args::default();\n\n    args.appdir = Some(kgw_owner_safe_runtime_appdir(settings.network));\n    args.utxoindex = settings.enable_utxo_index;\n    args.archival = settings.archival;\n    args.yes = true;\n    args.disable_upnp = true;\n    args.log_level = "INFO".to_string();\n''',
              '''    let mut args = kaspad_lib_tn12::args::Args {\n        appdir: Some(kgw_owner_safe_runtime_appdir(settings.network)),\n        utxoindex: settings.enable_utxo_index,\n        archival: settings.archival,\n        yes: true,\n        disable_upnp: true,\n        log_level: "INFO".to_string(),\n        ..Default::default()\n    };\n''',
              'tn12 Args initializer',
          )
          owner_path.write_text(owner)

          tx_path = Path('crates/kaspa-gateway-runtime/src/transaction_sync.rs')
          tx = tx_path.read_text()
          tx = replace_exact(
              tx,
              '''    if let (Some(start), Some(end)) = (request.start_ts, request.end_ts) {\n        if start > end {\n            return Err("start date cannot be after end date".to_string());\n        }\n    }\n''',
              '''    if let (Some(start), Some(end)) = (request.start_ts, request.end_ts)\n        && start > end\n    {\n        return Err("start date cannot be after end date".to_string());\n    }\n''',
              'date-range guards',
              expected=2,
          )
          tx = replace_exact(
              tx,
              '''        if let Some(next_before_for_prefetch) = page.next_before {\n            if next_before_for_prefetch > 0\n                && next_before_for_prefetch != before\n                && page_num + 1 < max_pages\n            {\n                let client_for_prefetch = client.clone();\n                let config_for_prefetch = config.clone();\n                let address_for_prefetch = address.clone();\n                let next_page_num = page_num + 1;\n                let next_page_number = next_page_num + 1;\n                let next_after_for_prefetch = 0_i64;\n\n                eprintln!(\n                    "[KGW][transactions][FetchWorker] Prefetch accepted page start address={} mode={} next_page={} before={} after={} limit={}",\n                    address,\n                    if request.force { "force" } else { "normal" },\n                    next_page_number,\n                    next_before_for_prefetch,\n                    next_after_for_prefetch,\n                    page_limit\n                );\n\n                next_prefetch = Some(tokio::spawn(async move {\n                    fetch_transactions_page_accepted(\n                        &client_for_prefetch,\n                        &config_for_prefetch,\n                        &address_for_prefetch,\n                        page_limit,\n                        next_before_for_prefetch,\n                        next_after_for_prefetch,\n                        next_page_num,\n                    )\n                    .await\n                }));\n            }\n        }\n''',
              '''        if let Some(next_before_for_prefetch) = page.next_before\n            && next_before_for_prefetch > 0\n            && next_before_for_prefetch != before\n            && page_num + 1 < max_pages\n        {\n            let client_for_prefetch = client.clone();\n            let config_for_prefetch = config.clone();\n            let address_for_prefetch = address.clone();\n            let next_page_num = page_num + 1;\n            let next_page_number = next_page_num + 1;\n            let next_after_for_prefetch = 0_i64;\n\n            eprintln!(\n                "[KGW][transactions][FetchWorker] Prefetch accepted page start address={} mode={} next_page={} before={} after={} limit={}",\n                address,\n                if request.force { "force" } else { "normal" },\n                next_page_number,\n                next_before_for_prefetch,\n                next_after_for_prefetch,\n                page_limit\n            );\n\n            next_prefetch = Some(tokio::spawn(async move {\n                fetch_transactions_page_accepted(\n                    &client_for_prefetch,\n                    &config_for_prefetch,\n                    &address_for_prefetch,\n                    page_limit,\n                    next_before_for_prefetch,\n                    next_after_for_prefetch,\n                    next_page_num,\n                )\n                .await\n            }));\n        }\n''',
              'prefetch let-chain',
          )
          tx = replace_exact(
              tx,
              '''            if let Some(txid) = transaction_id(raw) {\n                if existing_txids.contains(&txid) {\n                    page_existing_skipped += 1;\n                    continue;\n                }\n            }\n''',
              '''            if let Some(txid) = transaction_id(raw)\n                && existing_txids.contains(&txid)\n            {\n                page_existing_skipped += 1;\n                continue;\n            }\n''',
              'existing transaction let-chain',
          )
          tx = replace_exact(
              tx,
              '''        if let Some(oldest_ts_on_page) = accepted_timestamps.iter().copied().min() {\n            if request\n                .start_ts\n                .map(|start| oldest_ts_on_page < start)\n                .unwrap_or(false)\n            {\n                stopped_by_start_date = true;\n                stop_reason = format!(\n                    "before_start_date:page={}:oldest_ts={}",\n                    page_number, oldest_ts_on_page\n                );\n\n                eprintln!(\n                    "[KGW][transactions][FetchWorker] Fetch stop by start date address={} page={} oldest_ts={} start_ts={:?}",\n                    address, page_number, oldest_ts_on_page, request.start_ts\n                );\n\n                break 'sync_page_loop;\n            }\n        }\n''',
              '''        if let Some(oldest_ts_on_page) = accepted_timestamps.iter().copied().min()\n            && request\n                .start_ts\n                .map(|start| oldest_ts_on_page < start)\n                .unwrap_or(false)\n        {\n            stopped_by_start_date = true;\n            stop_reason = format!(\n                "before_start_date:page={}:oldest_ts={}",\n                page_number, oldest_ts_on_page\n            );\n\n            eprintln!(\n                "[KGW][transactions][FetchWorker] Fetch stop by start date address={} page={} oldest_ts={} start_ts={:?}",\n                address, page_number, oldest_ts_on_page, request.start_ts\n            );\n\n            break 'sync_page_loop;\n        }\n''',
              'start-date let-chain',
          )
          tx_path.write_text(tx)

          controller_path = Path('crates/kaspa-gateway-rk-node/src/kgw_service_controller.rs')
          controller = controller_path.read_text()
          controller = replace_exact(
              controller,
              '''        if let Some(network) = network {\n            if let Some(slot) = self.slots.get_mut(&network) {\n                if slot.logs.len() >= 128 {\n                    slot.logs.remove(0);\n                }\n                slot.logs.push(line);\n            }\n        }\n''',
              '''        if let Some(network) = network\n            && let Some(slot) = self.slots.get_mut(&network)\n        {\n            if slot.logs.len() >= 128 {\n                slot.logs.remove(0);\n            }\n            slot.logs.push(line);\n        }\n''',
              'service-controller let-chain',
          )
          controller_path.write_text(controller)

          official_path = Path('crates/kaspa-gateway-rk-node/src/official_kaspa_runtime.rs')
          official = official_path.read_text()
          test_block = '''#[cfg(test)]\nmod runtime_binding_tests {\n    use super::{KaspaRuntimeFamily, KaspaRuntimeNetwork};\n\n    const STABLE_REV: &str = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3";\n    const TN12_REV: &str = "eeb351ee911e2df906d21203dec8db3a195c6b33";\n\n    #[test]\n    fn mainnet_and_testnet10_share_the_official_stable_runtime() {\n        for network in [KaspaRuntimeNetwork::Mainnet, KaspaRuntimeNetwork::Testnet10] {\n            assert_eq!(network.family(), KaspaRuntimeFamily::Mainline);\n            assert_eq!(network.branch(), "stable");\n            assert_eq!(network.revision(), STABLE_REV);\n        }\n    }\n\n    #[test]\n    fn testnet12_remains_on_the_separate_experimental_runtime() {\n        let network = KaspaRuntimeNetwork::Testnet12;\n        assert_eq!(network.family(), KaspaRuntimeFamily::Tn12);\n        assert_eq!(network.branch(), "RKStratumTN12");\n        assert_eq!(network.revision(), TN12_REV);\n    }\n}\n'''
          official = replace_exact(official, test_block + '\n', '', 'runtime test module')
          official = official.rstrip() + '\n\n' + test_block
          official_path.write_text(official)
          PY

      - name: Format Rust sources
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Run rustfmt
        run: cargo fmt --all

      - name: Commit and push repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/kaspa-gateway-rk-node/src/kgw_real_owner_runtime.rs \
                  crates/kaspa-gateway-rk-node/src/kgw_service_controller.rs \
                  crates/kaspa-gateway-rk-node/src/official_kaspa_runtime.rs \
                  crates/kaspa-gateway-runtime/src/transaction_sync.rs
          git commit -m "fix: satisfy Rust 1.97 strict Clippy"
          git push origin HEAD:chore/modernization-final-2026-08-09
