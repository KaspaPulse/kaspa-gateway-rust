name: Dependency Lock Refresh

on:
  push:
    branches:
      - chore/security-baseline-2026-08-08
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: refresh Cargo.lock
    if: github.actor == 'KaspaPulse' && !contains(github.event.head_commit.message, '[lock-refresh]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/security-baseline-2026-08-08
          persist-credentials: true

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Resolve latest compatible dependencies
        run: cargo update

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo lockfile [lock-refresh]"
          git push origin HEAD:chore/security-baseline-2026-08-08
