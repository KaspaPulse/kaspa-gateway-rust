name: Graphify Refresh

on:
  push:
    branches:
      - chore/security-baseline-2026-08-08

permissions:
  contents: read

concurrency:
  group: graphify-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Graphify
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "graphifyy==0.9.36"
          graphify --version

      - name: Refresh source graph incrementally
        run: graphify . --update --no-viz

      - name: Query changed flows
        run: |
          graphify query "How do the upgraded Rust workspace, runtime ownership, Tauri commands, and gateway crates connect after the dependency modernization?"
          graphify query "How do the E2E Windows helpers and zero-touch live matrix connect to the desktop test flow?"

      - name: Validate generated snapshot
        run: |
          git diff --check
          test -s graphify-out/graph.json
          test -s graphify-out/manifest.json
          test -s graphify-out/GRAPH_REPORT.md

      - name: Upload allowed Graphify snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-source-snapshot
          path: |
            graphify-out/graph.json
            graphify-out/manifest.json
            graphify-out/GRAPH_REPORT.md
          retention-days: 3
