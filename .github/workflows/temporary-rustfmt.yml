name: Temporary Rustfmt Repair

on:
  push:
    branches: [chore/security-baseline-2026-08-08]
    paths:
      - "**/*.rs"
      - "rustfmt.toml"
      - ".github/workflows/temporary-rustfmt.yml"

permissions:
  contents: write

concurrency:
  group: temporary-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: apply rustfmt 1.97.1
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install Rust 1.97.1 rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet; then
            echo "rustfmt produced no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)**/*.rs'
          git commit -m "style: apply rustfmt 1.97.1"
          git push origin "HEAD:${GITHUB_REF_NAME}"
