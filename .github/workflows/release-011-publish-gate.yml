name: Desktop 0.1.1 Exact Publication Gate

on:
  push:
    branches:
      - ops/release-011-recovery-gate-20260817

permissions:
  actions: read
  attestations: read
  contents: write

jobs:
  publish-existing-draft:
    name: Verify and publish existing Desktop 0.1.1 draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "371168378"
      RELEASE_TAG: desktop-v0.1.1
      RELEASE_SOURCE: b911eb44619f8eab706bc2fe786d1c84ac958f1d
      EXPECTED_MAIN: ba53796a5933cdf97b6b810c208050686a8555e6
      SIGNER_WORKFLOW: KaspaPulse/kaspa-gateway-rust/.github/workflows/desktop-artifacts.yml

    steps:
      - name: Require dedicated release credential without exposing it
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_ADMIN_TOKEN:-}" ]]; then
            echo "RELEASE_ADMIN_TOKEN is not configured." >&2
            echo "Required fine-grained permissions: Administration read, Contents write, Workflows write." >&2
            exit 78
          fi
          echo "RELEASE_ADMIN_CREDENTIAL_PRESENT=YES"

      - name: Reconcile live repository, ruleset, and exact draft identity
        shell: bash
        run: |
          set -euo pipefail

          live_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$live_main" = "$EXPECTED_MAIN"
          echo "LIVE_MAIN=$live_main"

          ruleset="$RUNNER_TEMP/ruleset.json"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/20627285" >"$ruleset"
          test "$(jq -r .name "$ruleset")" = "main-rebootstrap-baseline"
          test "$(jq -r .enforcement "$ruleset")" = "active"
          test "$(jq -r '.current_user_can_bypass // "never"' "$ruleset")" = "never"

          echo "OPEN_PRS_BEGIN"
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | "#\(.number) \(.title)"'
          echo "OPEN_PRS_END"

          releases="$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" >"$releases"
          test "$(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' "$releases")" = "1"
          test "$(jq --argjson id "$RELEASE_ID" --arg tag "$RELEASE_TAG" '[.[] | select(.id == $id and .tag_name == $tag)] | length' "$releases")" = "1"

          draft="$RUNNER_TEMP/draft-before.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$draft"
          test "$(jq -r .id "$draft")" = "$RELEASE_ID"
          test "$(jq -r .draft "$draft")" = "true"
          test "$(jq -r '.published_at // "null"' "$draft")" = "null"
          test "$(jq -r .prerelease "$draft")" = "false"
          test "$(jq -r .tag_name "$draft")" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish "$draft")" = "$RELEASE_SOURCE"
          test "$(jq '.assets | length' "$draft")" = "6"

          latest="$RUNNER_TEMP/latest-before.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" >"$latest"
          test "$(jq -r .tag_name "$latest")" = "desktop-v0.1.0"
          test "$(jq -r .draft "$latest")" = "false"
          test "$(jq -r .immutable "$latest")" = "true"

          echo "PREPUBLICATION_IDENTITY_GATE=PASS"

      - name: Download exact draft assets by ID and verify bytes
        shell: bash
        run: |
          set -euo pipefail

          draft="$RUNNER_TEMP/draft-before.json"
          out="$RUNNER_TEMP/release-assets"
          mkdir -m 700 "$out"

          expected="$RUNNER_TEMP/expected-assets.tsv"
          cat >"$expected" <<'EOF'
          516117491	KASPA_GATEWAY_MACOS_BUILD_PROVENANCE_0.1.1_b911eb4.sigstore.json	11504	sha256:821b58d56bc894d43ee8f1b9962ff9394f09f0476d43ed86843311b567104b0d
          516117493	KASPA_GATEWAY_MACOS_UNIVERSAL_APP_0.1.1_b911eb4.zip	74951344	sha256:82195836a67e143bf5b4d085bf42b7491d5332b05ac19cb79980df39aa5a8e9f
          516117490	KASPA_GATEWAY_MACOS_UNIVERSAL_DMG_0.1.1_b911eb4.dmg	74846015	sha256:ba5150b92860ca316e85e5fa90d27c60f2e15b0a7f0c6beed8ac970eb18b6387
          516117492	KASPA_GATEWAY_WINDOWS_BUILD_PROVENANCE_0.1.1_b911eb4.sigstore.json	11403	sha256:9b6dc872f784f99841ecf25e4151250f7f5688677b51a72ba289cf133ae6dfa8
          516117494	KASPA_GATEWAY_WINDOWS_X64_NSIS_0.1.1_b911eb4.exe	22101400	sha256:eff90f265fe782fb186f5d79950a2b0c42ff463ad36fcdf2675526a4d4133082
          516117646	SHA256SUMS.txt	615	sha256:c6e4dd07f91b721e37d69b778a640e9af3fc55e25d1f2ad33ca4635ac1087624
          EOF

          while IFS=$'\t' read -r asset_id name expected_size expected_digest; do
            test "$(jq --argjson id "$asset_id" '[.assets[] | select(.id == $id)] | length' "$draft")" = "1"
            test "$(jq -r --argjson id "$asset_id" '.assets[] | select(.id == $id) | .name' "$draft")" = "$name"
            test "$(jq -r --argjson id "$asset_id" '.assets[] | select(.id == $id) | .size' "$draft")" = "$expected_size"
            test "$(jq -r --argjson id "$asset_id" '.assets[] | select(.id == $id) | .digest' "$draft")" = "$expected_digest"

            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              >"$out/$name"

            test -s "$out/$name"
            test "$(stat -c %s "$out/$name")" = "$expected_size"
            actual_hash="$(sha256sum "$out/$name" | awk '{print $1}')"
            test "sha256:$actual_hash" = "$expected_digest"
            printf 'ASSET_OK=%s sha256:%s\n' "$name" "$actual_hash"
          done <"$expected"

          test "$(find "$out" -maxdepth 1 -type f | wc -l)" = "6"
          (
            cd "$out"
            sha256sum --check --strict SHA256SUMS.txt
          )
          echo "DRAFT_BYTE_GATE=PASS"

      - name: Reverify build provenance before publication
        shell: bash
        run: |
          set -euo pipefail

          out="$RUNNER_TEMP/release-assets"
          win="$out/KASPA_GATEWAY_WINDOWS_X64_NSIS_0.1.1_b911eb4.exe"
          win_bundle="$out/KASPA_GATEWAY_WINDOWS_BUILD_PROVENANCE_0.1.1_b911eb4.sigstore.json"
          mac_dmg="$out/KASPA_GATEWAY_MACOS_UNIVERSAL_DMG_0.1.1_b911eb4.dmg"
          mac_zip="$out/KASPA_GATEWAY_MACOS_UNIVERSAL_APP_0.1.1_b911eb4.zip"
          mac_bundle="$out/KASPA_GATEWAY_MACOS_BUILD_PROVENANCE_0.1.1_b911eb4.sigstore.json"

          verify_subject() {
            local subject="$1"
            local bundle="$2"

            gh attestation verify "$subject" \
              -R "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$RELEASE_SOURCE" \
              --source-ref refs/heads/main \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners >/dev/null

            gh attestation verify "$subject" \
              -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$RELEASE_SOURCE" \
              --source-ref refs/heads/main \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners >/dev/null
          }

          verify_subject "$win" "$win_bundle"
          verify_subject "$mac_dmg" "$mac_bundle"
          verify_subject "$mac_zip" "$mac_bundle"
          echo "PREPUBLICATION_PROVENANCE_GATE=PASS"

      - name: Verify immutable administration state and publish exact release ID
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"

          # Fresh immutable-releases administration read immediately before publication.
          immutable="$RUNNER_TEMP/immutable-releases.json"
          gh api "repos/$GITHUB_REPOSITORY/immutable-releases" >"$immutable"
          test "$(jq -r .enabled "$immutable")" = "true"
          echo "IMMUTABLE_RELEASES_ENABLED=true"

          # Re-read the exact draft with the publication credential before mutation.
          draft="$RUNNER_TEMP/draft-admin-before.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$draft"
          test "$(jq -r .draft "$draft")" = "true"
          test "$(jq -r '.published_at // "null"' "$draft")" = "null"
          test "$(jq -r .tag_name "$draft")" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish "$draft")" = "$RELEASE_SOURCE"
          test "$(jq '.assets | length' "$draft")" = "6"

          # Publish the already-verified draft in place. Do not change tag, target, title, notes, or assets.
          published="$RUNNER_TEMP/publish-response.json"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -F make_latest=true \
            >"$published"

          test "$(jq -r .id "$published")" = "$RELEASE_ID"
          test "$(jq -r .draft "$published")" = "false"
          test "$(jq -r .tag_name "$published")" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish "$published")" = "$RELEASE_SOURCE"
          echo "PUBLICATION_MUTATION=SUCCESS"

      - name: Verify published release identity, immutability, tag, and assets
        shell: bash
        run: |
          set -euo pipefail

          published="$RUNNER_TEMP/release-after.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$published"

          test "$(jq -r .draft "$published")" = "false"
          test "$(jq -r .prerelease "$published")" = "false"
          test "$(jq -r .tag_name "$published")" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish "$published")" = "$RELEASE_SOURCE"
          test "$(jq -r '.published_at // "null"' "$published")" != "null"
          test "$(jq -r .immutable "$published")" = "true"
          test "$(jq '.assets | length' "$published")" = "6"

          latest="$RUNNER_TEMP/latest-after.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" >"$latest"
          test "$(jq -r .id "$latest")" = "$RELEASE_ID"
          test "$(jq -r .tag_name "$latest")" = "$RELEASE_TAG"
          test "$(jq -r .immutable "$latest")" = "true"

          ref="$RUNNER_TEMP/tag-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >"$ref"
          object_type="$(jq -r .object.type "$ref")"
          object_sha="$(jq -r .object.sha "$ref")"

          while [[ "$object_type" == "tag" ]]; do
            tag_obj="$RUNNER_TEMP/tag-object.json"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" >"$tag_obj"
            object_type="$(jq -r .object.type "$tag_obj")"
            object_sha="$(jq -r .object.sha "$tag_obj")"
          done

          test "$object_type" = "commit"
          test "$object_sha" = "$RELEASE_SOURCE"

          expected="$RUNNER_TEMP/expected-assets.tsv"
          while IFS=$'\t' read -r asset_id name expected_size expected_digest; do
            test "$(jq --argjson id "$asset_id" '[.assets[] | select(.id == $id)] | length' "$published")" = "1"
            test "$(jq -r --argjson id "$asset_id" '.assets[] | select(.id == $id) | .name' "$published")" = "$name"
            test "$(jq -r --argjson id "$asset_id" '.assets[] | select(.id == $id) | .size' "$published")" = "$expected_size"
            test "$(jq -r --argjson id "$asset_id" '.assets[] | select(.id == $id) | .digest' "$published")" = "$expected_digest"
          done <"$expected"

          echo "POSTPUBLICATION_IDENTITY_GATE=PASS"

      - name: Verify GitHub immutable release attestation and every downloaded release asset
        shell: bash
        run: |
          set -euo pipefail

          out="$RUNNER_TEMP/release-assets"

          verified=0
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" = "1"

          for file in "$out"/*; do
            gh release verify-asset "$RELEASE_TAG" "$file" -R "$GITHUB_REPOSITORY" >/dev/null
          done
          echo "IMMUTABLE_RELEASE_ATTESTATION_GATE=PASS"

      - name: Reverify product build attestations after publication
        shell: bash
        run: |
          set -euo pipefail

          out="$RUNNER_TEMP/release-assets"
          win="$out/KASPA_GATEWAY_WINDOWS_X64_NSIS_0.1.1_b911eb4.exe"
          win_bundle="$out/KASPA_GATEWAY_WINDOWS_BUILD_PROVENANCE_0.1.1_b911eb4.sigstore.json"
          mac_dmg="$out/KASPA_GATEWAY_MACOS_UNIVERSAL_DMG_0.1.1_b911eb4.dmg"
          mac_zip="$out/KASPA_GATEWAY_MACOS_UNIVERSAL_APP_0.1.1_b911eb4.zip"
          mac_bundle="$out/KASPA_GATEWAY_MACOS_BUILD_PROVENANCE_0.1.1_b911eb4.sigstore.json"

          verify_subject() {
            local subject="$1"
            local bundle="$2"
            gh attestation verify "$subject" \
              -R "$GITHUB_REPOSITORY" \
              --bundle "$bundle" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$RELEASE_SOURCE" \
              --source-ref refs/heads/main \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners >/dev/null
            gh attestation verify "$subject" \
              -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --source-digest "$RELEASE_SOURCE" \
              --source-ref refs/heads/main \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners >/dev/null
          }

          verify_subject "$win" "$win_bundle"
          verify_subject "$mac_dmg" "$mac_bundle"
          verify_subject "$mac_zip" "$mac_bundle"

          echo "POSTPUBLICATION_BUILD_PROVENANCE_GATE=PASS"
          echo "RELEASE_RESULT=IMMUTABLE_DESKTOP_0.1.1_VERIFIED"
