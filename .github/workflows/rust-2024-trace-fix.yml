name: Rust 2024 Trace Test Fix

on:
  push:
    branches:
      - chore/security-baseline-2026-08-08
    paths:
      - .github/workflows/rust-2024-trace-fix.yml

permissions:
  contents: write

concurrency:
  group: rust-2024-trace-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Replace unsafe process-environment mutation with test-local override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path("apps/kaspa-gateway-desktop/src-tauri/src/integrated_runtime_commands.rs")
          text = runtime.read_text()
          old = '''pub(crate) fn kgw_start_trace_enabled_v1() -> bool {
              match std::env::var("KGW_START_TRACE") {'''
          new = '''#[cfg(test)]
          thread_local! {
              static KGW_START_TRACE_TEST_ENABLED_V1: std::cell::Cell<bool> =
                  const { std::cell::Cell::new(false) };
          }

          #[cfg(test)]
          pub(crate) struct KgwStartTraceTestGuardV1 {
              previous: bool,
          }

          #[cfg(test)]
          impl Drop for KgwStartTraceTestGuardV1 {
              fn drop(&mut self) {
                  KGW_START_TRACE_TEST_ENABLED_V1.with(|enabled| enabled.set(self.previous));
              }
          }

          #[cfg(test)]
          pub(crate) fn kgw_start_trace_test_enable_v1() -> KgwStartTraceTestGuardV1 {
              let previous = KGW_START_TRACE_TEST_ENABLED_V1.with(|enabled| {
                  let previous = enabled.get();
                  enabled.set(true);
                  previous
              });

              KgwStartTraceTestGuardV1 { previous }
          }

          pub(crate) fn kgw_start_trace_enabled_v1() -> bool {
              #[cfg(test)]
              if KGW_START_TRACE_TEST_ENABLED_V1.with(|enabled| enabled.get()) {
                  return true;
              }

              match std::env::var("KGW_START_TRACE") {'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one trace-enabled function anchor, found {text.count(old)}")
          runtime.write_text(text.replace(old, new, 1))

          lib = Path("apps/kaspa-gateway-desktop/src-tauri/src/lib.rs")
          text = lib.read_text()
          old_enable = '''        std::env::set_var("KGW_START_TRACE", "1");
                  let _ = integrated_runtime_commands::kgw_start_trace_test_take_lines_v1();'''
          new_enable = '''        let _trace_guard = integrated_runtime_commands::kgw_start_trace_test_enable_v1();
                  let _ = integrated_runtime_commands::kgw_start_trace_test_take_lines_v1();'''
          if text.count(old_enable) != 1:
              raise SystemExit(f"expected one trace test enable anchor, found {text.count(old_enable)}")
          text = text.replace(old_enable, new_enable, 1)

          old_disable = '''
                  std::env::remove_var("KGW_START_TRACE");'''
          if text.count(old_disable) != 1:
              raise SystemExit(f"expected one trace test disable anchor, found {text.count(old_disable)}")
          lib.write_text(text.replace(old_disable, "", 1))
          PY

      - name: Format Rust source
        run: cargo fmt --all

      - name: Install Graphify
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "graphifyy==0.9.36"
          graphify --version

      - name: Refresh source graph incrementally
        run: graphify . --update --code-only --no-viz

      - name: Query changed trace flow
        run: graphify query "How does the Rust 2024-safe clipboard trace test enable tracing without mutating process environment variables?"

      - name: Validate and commit source plus Graphify snapshot
        shell: bash
        run: |
          git diff --check
          test -s graphify-out/graph.json
          test -s graphify-out/manifest.json
          test -s graphify-out/GRAPH_REPORT.md
          ! grep -R --line-number 'std::env::set_var("KGW_START_TRACE"\|std::env::remove_var("KGW_START_TRACE"' apps/kaspa-gateway-desktop/src-tauri/src/lib.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/kaspa-gateway-desktop/src-tauri/src/integrated_runtime_commands.rs \
            apps/kaspa-gateway-desktop/src-tauri/src/lib.rs \
            graphify-out/graph.json \
            graphify-out/manifest.json \
            graphify-out/GRAPH_REPORT.md
          git rm .github/workflows/rust-2024-trace-fix.yml
          git diff --cached --check
          git commit -m "fix: make trace test Rust 2024 safe"
          git push origin HEAD:chore/security-baseline-2026-08-08
