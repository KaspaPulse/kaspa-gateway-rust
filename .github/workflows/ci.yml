name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: quality (rust + npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            apps/kaspa-gateway-desktop/package-lock.json
            e2e/package-lock.json
          package-manager-cache: true

      - name: Verify bundled npm
        run: |
          npm --version
          test "$(npm --version)" = "11.17.0"

      - name: Configure isolated application data root
        shell: bash
        run: |
          data_root="${RUNNER_TEMP}/kaspa-gateway-data"
          rm -rf -- "$data_root"
          install -d -m 700 -- "$data_root"
          printf 'KASPA_GATEWAY_DATA_DIR=%s\n' "$data_root" >> "$GITHUB_ENV"

      - name: Install desktop npm dependencies
        working-directory: apps/kaspa-gateway-desktop
        run: npm ci --ignore-scripts

      - name: Install E2E npm dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Lint desktop JavaScript
        working-directory: apps/kaspa-gateway-desktop
        run: npm run lint

      - name: Verify effective Node settings contract
        run: node tools/kgw_effective_node_settings_gate.cjs

      - name: Verify effective Bridge settings contract
        run: node tools/kgw_effective_bridge_settings_gate.cjs

      - name: Verify runtime automation claims
        run: node tools/kgw_runtime_automation_claims_gate.cjs

      - name: Verify desktop artifact workflow contract
        run: node tools/kgw_desktop_artifacts_workflow_gate.cjs

      - name: Lint and syntax-check E2E JavaScript
        working-directory: e2e
        run: |
          npm run lint
          npm run check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        id: cargo-check
        shell: bash
        run: |
          set +e
          cargo check --locked --workspace --all-targets 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload cargo-check diagnostics
        if: failure() && steps.cargo-check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-check-diagnostics
          path: cargo-check.log
          retention-days: 3

      - name: Clippy strict
        id: clippy
        shell: bash
        run: |
          set +e
          status=0

          cargo clippy --locked --workspace --lib --bins --examples --benches -- -D warnings 2>&1 | tee clippy-production.log
          command_status=${PIPESTATUS[0]}
          if (( command_status != 0 )); then status=$command_status; fi

          cargo clippy --locked --workspace --tests --exclude kaspa-gateway-desktop -- -D warnings 2>&1 | tee clippy-workspace-tests.log
          command_status=${PIPESTATUS[0]}
          if (( command_status != 0 )); then status=$command_status; fi

          # The desktop integration harness path-includes the runtime module and
          # intentionally exercises a selected subset of its private entry points.
          # Production targets remain fully strict; only test-target dead-code is exempt.
          cargo clippy --locked -p kaspa-gateway-desktop --tests -- -D warnings -A dead-code 2>&1 | tee clippy-desktop-tests.log
          command_status=${PIPESTATUS[0]}
          if (( command_status != 0 )); then status=$command_status; fi

          cat clippy-production.log clippy-workspace-tests.log clippy-desktop-tests.log > clippy.log
          exit "$status"

      - name: Upload clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-diagnostics
          path: |
            clippy.log
            clippy-production.log
            clippy-workspace-tests.log
            clippy-desktop-tests.log
          retention-days: 3

      - name: Run Rust tests
        id: rust-tests
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace --all-targets 2>&1 | tee rust-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Rust test diagnostics
        if: failure() && steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-diagnostics
          path: rust-tests.log
          retention-days: 3

      - name: Audit desktop npm tree
        id: desktop-npm-audit
        working-directory: apps/kaspa-gateway-desktop
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate 2>&1 | tee npm-audit.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload desktop npm audit diagnostics
        if: failure() && steps.desktop-npm-audit.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-npm-audit-diagnostics
          path: apps/kaspa-gateway-desktop/npm-audit.log
          retention-days: 3

      - name: Audit E2E npm tree
        id: e2e-npm-audit
        working-directory: e2e
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate 2>&1 | tee npm-audit.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload E2E npm audit diagnostics
        if: failure() && steps.e2e-npm-audit.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-npm-audit-diagnostics
          path: e2e/npm-audit.log
          retention-days: 3

  node-current-compatibility:
    name: Node.js 26 compatibility (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: |
            apps/kaspa-gateway-desktop/package-lock.json
            e2e/package-lock.json
          package-manager-cache: true

      - name: Verify bundled npm
        run: |
          npm --version
          test "$(npm --version)" = "11.19.0"

      - name: Install desktop npm dependencies
        working-directory: apps/kaspa-gateway-desktop
        run: npm ci --ignore-scripts

      - name: Install E2E npm dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Validate JavaScript workspaces
        shell: bash
        run: |
          npm --prefix apps/kaspa-gateway-desktop run lint
          npm --prefix e2e run lint
          npm --prefix e2e run check
