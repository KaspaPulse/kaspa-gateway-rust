name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ksss-adoption:
    name: KSSS v1.2.0 adoption
    runs-on: ubuntu-24.04
    # Cold-cache KSSS builds include native DuckDB/Python dependencies; keep this bounded but above the observed 10-minute compile floor.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Python 3.12 for signed KSSS runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ksss-msrv-1.97.1

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Run Rust-owned KSSS adoption stage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo run --locked -p xtask --features ksss -- ci-workflow-stage ksss-adoption

      - name: Retain KSSS evaluation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kgw-ksss-adoption-evidence
          path: ${{ runner.temp }}/kgw-ksss-*.json
          if-no-files-found: error
          retention-days: 14

  msrv:
    needs: ksss-adoption
    name: msrv (Rust 1.97.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-1.97.1

      - name: Run Rust-owned MSRV stage
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
          KASPA_GATEWAY_DATA_DIR: ${{ runner.temp }}/kaspa-gateway-msrv-data
        run: cargo run --locked -p xtask -- ci-workflow-stage msrv

  quality:
    needs: ksss-adoption
    name: quality (rust + npm)
    runs-on: ubuntu-24.04
    # A true cold Rust cache must compile native workspace dependencies before Clippy/tests can reuse them. The observed 60-minute budget cancelled an active all-targets check with no product-test failure, so retain a bounded 120-minute cold-cache budget.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pinned wasm-pack 0.15.0
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            apps/kaspa-gateway-desktop/package-lock.json
            e2e/package-lock.json
          package-manager-cache: true

      - name: Run Rust-owned quality stage
        id: quality-stage
        env:
          KASPA_GATEWAY_DATA_DIR: ${{ runner.temp }}/kaspa-gateway-data
        run: cargo run --locked -p xtask -- ci-workflow-stage quality

      - name: Upload quality diagnostics
        if: failure() && steps.quality-stage.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-diagnostics
          path: |
            apps/kaspa-gateway-desktop/npm-ci.log
            apps/kaspa-gateway-desktop/npm-audit.json
            e2e/npm-ci.log
            e2e/npm-audit.json
            cargo-check.log
            clippy-*.jsonl
            clippy-*.stderr.log
            clippy-*-policy.log
            rust-tests.log
          if-no-files-found: ignore
          retention-days: 3

  node-current-compatibility:
    name: Node.js 26 compatibility (non-blocking)
    runs-on: ubuntu-24.04
    # Cold-cache Rust-owned compatibility tooling can exceed 10 minutes on main; retain a bounded budget without cancelling the compatibility signal.
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: |
            apps/kaspa-gateway-desktop/package-lock.json
            e2e/package-lock.json
          package-manager-cache: true

      - name: Run Rust-owned Node-current compatibility stage
        run: cargo run --locked -p xtask -- ci-workflow-stage node-current
