name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: quality (rust + npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/kaspa-gateway-desktop/package-lock.json
          package-manager-cache: true

      - name: Install npm dependencies
        working-directory: apps/kaspa-gateway-desktop
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        id: cargo-check
        shell: bash
        run: |
          set +e
          cargo check --locked --workspace --all-targets 2>&1 | tee cargo-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload cargo-check diagnostics
        if: failure() && steps.cargo-check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-check-diagnostics
          path: cargo-check.log
          retention-days: 3

      - name: Clippy strict
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-diagnostics
          path: clippy.log
          retention-days: 3

      - name: Run Rust tests
        id: rust-tests
        shell: bash
        run: |
          set +e
          cargo test --locked --workspace --all-targets 2>&1 | tee rust-tests.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Rust test diagnostics
        if: failure() && steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-test-diagnostics
          path: rust-tests.log
          retention-days: 3

      - name: npm audit
        id: npm-audit
        working-directory: apps/kaspa-gateway-desktop
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate 2>&1 | tee npm-audit.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload npm-audit diagnostics
        if: failure() && steps.npm-audit.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-diagnostics
          path: apps/kaspa-gateway-desktop/npm-audit.log
          retention-days: 3
