name: Dependency & Supply Chain Security

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".cargo/audit.toml"
      - "SECURITY_ADVISORIES.md"
      - "xtask/**"
      - ".github/workflows/security.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: policy + audit + deny + machete
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0

      - name: Test native CI diagnostic contracts
        run: cargo test --locked -p xtask --bin kgw-ci-diagnostics

      - name: Validate advisory exception policy
        run: cargo run --locked -p xtask -- check-security-advisories --max-age-days 45

      - name: Install supply-chain tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
          fallback: none

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny
        id: cargo-deny
        run: cargo run --locked -p xtask --bin kgw-ci-diagnostics -- capture-cargo-deny --directory .

      - name: Upload cargo-deny diagnostics
        if: failure() && steps.cargo-deny.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-deny-diagnostics
          path: cargo-deny.log
          retention-days: 3

      - name: Unused dependency scan
        id: cargo-machete
        run: cargo run --locked -p xtask --bin kgw-ci-diagnostics -- capture-cargo-machete --directory .

      - name: Upload cargo-machete diagnostics
        if: failure() && steps.cargo-machete.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-machete-diagnostics
          path: cargo-machete.log
          retention-days: 3

      - name: Duplicate dependency report
        run: cargo tree --locked -d
