name: Temporary zip upgrade

on:
  push:
    branches:
      - chore/modernization-final-2026-08-09
    paths:
      - '.github/workflows/_temporary-zip-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/modernization-final-2026-08-09
          fetch-depth: 0

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Upgrade zip to the current stable major
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/kaspa-gateway-desktop/src-tauri/Cargo.toml')
          text = path.read_text()
          old = 'zip = "6.0.0"'
          new = 'zip = "8.6.0"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r} entry')
          path.write_text(text.replace(old, new))
          PY
          cargo update -p zip --precise 8.6.0
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Commit and push dependency upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/kaspa-gateway-desktop/src-tauri/Cargo.toml Cargo.lock
          git diff --cached --check
          git commit -m 'build: upgrade zip to 8.6.0'
          git push origin HEAD:chore/modernization-final-2026-08-09
