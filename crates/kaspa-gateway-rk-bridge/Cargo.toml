[package]
name = "kaspa-gateway-rk-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

rkstratum_cpu_miner = [
    "kaspa-stratum-bridge-mainline?/rkstratum_cpu_miner",
    "kaspa-stratum-bridge-tn13?/rkstratum_cpu_miner"
]

official-kaspa-runtime-mainline = [
    "dep:kaspa-grpc-client-mainline",
    "dep:kaspa-rpc-core-mainline",
    "dep:kaspa-stratum-bridge-mainline"
]

official-kaspa-runtime-tn13 = [
    "dep:kaspa-grpc-client-tn13",
    "dep:kaspa-rpc-core-tn13",
    "dep:kaspa-stratum-bridge-tn13"
]

official-kaspa-runtime-all = [
    "official-kaspa-runtime-mainline",
    "official-kaspa-runtime-tn13"
]

[dependencies]
kaspa-gateway-core = { path = "../kaspa-gateway-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }

kaspa-grpc-client-mainline = { package = "kaspa-grpc-client", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "01b532e8b553523216471682649693af92f0fd16", optional = true }
kaspa-rpc-core-mainline = { package = "kaspa-rpc-core", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "01b532e8b553523216471682649693af92f0fd16", optional = true }
kaspa-stratum-bridge-mainline = { package = "kaspa-stratum-bridge", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "01b532e8b553523216471682649693af92f0fd16", optional = true }
kaspa-grpc-client-tn13 = { package = "kaspa-grpc-client", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "ad45e241e6688a14901fd24dd8dc33c5c9a33f40", optional = true }
kaspa-rpc-core-tn13 = { package = "kaspa-rpc-core", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "ad45e241e6688a14901fd24dd8dc33c5c9a33f40", optional = true }
kaspa-stratum-bridge-tn13 = { package = "kaspa-stratum-bridge", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "ad45e241e6688a14901fd24dd8dc33c5c9a33f40", optional = true }
