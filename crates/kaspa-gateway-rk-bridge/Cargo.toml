[package]
name = "kaspa-gateway-rk-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

rkstratum_cpu_miner = [
    "dep:kaspa-stratum-bridge-tn12",
    "kaspa-stratum-bridge-tn12/rkstratum_cpu_miner"
]

official-kaspa-runtime-mainline = [
    "dep:kaspa-grpc-client-mainline",
    "dep:kaspa-rpc-core-mainline",
    "dep:kaspa-stratum-bridge-mainline"
]

official-kaspa-runtime-tn12 = [
    "dep:kaspa-grpc-client-tn12",
    "dep:kaspa-rpc-core-tn12",
    "dep:kaspa-stratum-bridge-tn12"
]

official-kaspa-runtime-all = [
    "official-kaspa-runtime-mainline",
    "official-kaspa-runtime-tn12"
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }

kaspa-grpc-client-mainline = { package = "kaspa-grpc-client", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3", optional = true }
kaspa-rpc-core-mainline = { package = "kaspa-rpc-core", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3", optional = true }
kaspa-stratum-bridge-mainline = { package = "kaspa-stratum-bridge", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "cfafeb4c093fa37a303f1b9f19c58f986b870ce3", optional = true }
kaspa-grpc-client-tn12 = { package = "kaspa-grpc-client", git = "https://github.com/LiveLaughLove13/rusty-kaspa.git", rev = "eeb351ee911e2df906d21203dec8db3a195c6b33", optional = true }
kaspa-rpc-core-tn12 = { package = "kaspa-rpc-core", git = "https://github.com/LiveLaughLove13/rusty-kaspa.git", rev = "eeb351ee911e2df906d21203dec8db3a195c6b33", optional = true }
kaspa-stratum-bridge-tn12 = { package = "kaspa-stratum-bridge", git = "https://github.com/LiveLaughLove13/rusty-kaspa.git", rev = "eeb351ee911e2df906d21203dec8db3a195c6b33", optional = true }
