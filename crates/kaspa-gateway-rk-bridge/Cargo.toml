[package]
name = "kaspa-gateway-rk-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

rkstratum_cpu_miner = [
    "dep:kaspa-stratum-bridge-tn12",
    "kaspa-stratum-bridge-tn12/rkstratum_cpu_miner"
]

official-kaspa-runtime-mainline = [
    "dep:kaspa-stratum-bridge-mainline"
]

official-kaspa-runtime-tn12 = [
    "dep:kaspa-stratum-bridge-tn12"
]

official-kaspa-runtime-all = [
    "official-kaspa-runtime-mainline",
    "official-kaspa-runtime-tn12"
]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

kaspa-stratum-bridge-mainline = { package = "kaspa-stratum-bridge", git = "https://github.com/kaspanet/rusty-kaspa.git", rev = "d7f9b1590ca68c95ebe9f7242b822ecdf867de7e", optional = true }
kaspa-stratum-bridge-tn12 = { package = "kaspa-stratum-bridge", git = "https://github.com/LiveLaughLove13/rusty-kaspa.git", rev = "f197b5ca00a92825f9962db1b3ed0f5d00455464", optional = true }



